name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Update apt
      run: sudo apt-get update

    - name: Install tools
      run: sudo apt-get install -y git zip unzip

    - name: Install Java
      run: sudo apt-get install -y openjdk-17-jdk

    - name: Install pip
      run: sudo apt-get install -y python3-pip

    - name: Install libraries
      run: sudo apt-get install -y autoconf libtool pkg-config

    - name: Install more libs
      run: sudo apt-get install -y zlib1g-dev libncurses5-dev libncursesw5-dev

    - name: Install dev tools
      run: sudo apt-get install -y libtinfo5 cmake libffi-dev libssl-dev

    - name: Upgrade pip
      run: pip install --upgrade pip

    - name: Install Buildozer
      run: pip install buildozer cython==0.29.36

    - name: Build APK
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: package
        path: bin/*.apk
